[package]
name = "plottery_server"
edition = "2021"
description = "pen-plotter server executable of Plottery, a creative coding framework for generative vector graphics and pen plotting."
version.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
categories.workspace = true
repository.workspace = true
keywords.workspace = true

[features]
default = []
raspi = ["dep:rppal", "dep:libc"]

[dependencies]
plottery_lib = { path = "../lib", version = "^0.23.2", default-features = false }
plottery_server_lib = { path = "../server_lib", version = "^0.23.2" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal", "sync", "time", "macros"] }
rppal = { version = "0.22.1", features = ["hal"], optional = true }
anyhow.workspace = true
libc = { version = "0.2", optional = true }
