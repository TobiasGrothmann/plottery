[package]
name = "plottery_project"
edition = "2021"
description = "Project management library of Plottery, a creative coding framework for generative vector graphics and pen plotting."
version.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
categories.workspace = true
repository.workspace = true
keywords.workspace = true
include = ["src/**", "Cargo.toml", "cargo_project_template/**", "resources/**"]

[dependencies]
plottery_runtime = { path = "../runtime", version = "^0.18.0" }
plottery_lib = { path = "../lib", version = "^0.18.0" }
anyhow.workspace = true
bincode.workspace = true
path-absolutize.workspace = true
directories = "5.0.1"
chrono = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
toml = "0.8.8"
tempfile.workspace = true
resvg = "0.37.0"
async-process = "2.0.1"
async-io = "2.3.0"
futures-lite.workspace = true
tokio = { workspace = true, features = ["rt"] }
rust-embed = "8.0.0"
vfs = { version = "0.12.0", features = ["embedded-fs"] }
walkdir = "2.5"
nix = { version = "0.29", features = ["signal"] }
