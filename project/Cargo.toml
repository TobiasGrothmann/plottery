[package]
name = "plottery_project"
edition = "2021"
description = "Project management library of Plottery, a creative coding framework for generative vector graphics and pen plotting."
version.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
categories.workspace = true
repository.workspace = true
keywords.workspace = true
include = ["src/**", "Cargo.toml", "cargo_project_template/**", "resources/**"]

[dependencies]
plottery_runtime = { path = "../runtime", version = "^0.18.0" }
plottery_lib = { path = "../lib", version = "^0.18.0" }
anyhow = "1.0.75"
bincode = "1.3.3"
path-absolutize = "3.1.1"
directories = "5.0.1"
chrono = { version = "0.4.31", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8.8"
tempfile = "3.8.1"
resvg = "0.37.0"
async-process = "2.0.1"
async-io = "2.3.0"
futures-lite = "2.2.0"
tokio = { version = "1.35.1", features = ["rt"] }
rust-embed = "8.0.0"
vfs = { version = "0.12.0", features = ["embedded-fs"] }
walkdir = "2.5"
nix = { version = "0.29", features = ["signal"] }
