[package]
name = "plottery_project"
edition = "2021"
description = "Project management library of Plottery, a creative coding framework for generative vector graphics and pen plotting."
version.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
categories.workspace = true
repository.workspace = true
keywords.workspace = true
include = ["src/**", "Cargo.toml", "cargo_project_template/**", "resources/**"]

[dependencies]
plottery_runtime = { path = "../runtime", version = "^0.23.2" }
plottery_lib = { path = "../lib", version = "^0.23.2" }
anyhow.workspace = true
postcard.workspace = true
path-absolutize.workspace = true
directories = "6"
chrono = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
toml = "1"
tempfile.workspace = true
rand = "0.10"
resvg = "0.50"
async-process = "2.0.1"
async-io = "2.3.0"
blocking = "1.6"
futures-lite.workspace = true
tokio = { workspace = true, features = ["rt"] }
rust-embed = "8.0.0"
vfs = { version = "0.13", features = ["embedded-fs"] }
walkdir = "2.5"
nix = { version = "0.32", features = ["signal"] }
