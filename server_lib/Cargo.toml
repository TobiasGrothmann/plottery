[package]
name = "plottery_server_lib"
edition = "2021"
description = "library for the communication with the pen-plotter server of Plottery, a creative coding framework for generative vector graphics and pen plotting."
version.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
categories.workspace = true
repository.workspace = true
keywords.workspace = true

[features]
# The HTTP client the editor uses to find the server and send it tasks.
client = ["dep:reqwest", "dep:tokio"]

[dependencies]
postcard.workspace = true
anyhow.workspace = true
itertools.workspace = true
plottery_lib = { path = "../lib", version = "^0.23.1", default-features = false }
serde.workspace = true
reqwest = { version = "0.13", default-features = false, optional = true }
tokio = { workspace = true, features = ["time"], optional = true }
mdns-sd = "0.22.0"

[dev-dependencies]
tempfile.workspace = true
