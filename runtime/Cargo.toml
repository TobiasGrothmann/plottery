[package]
name = "plottery_runtime"
edition = "2021"
description = "What a Plottery project compiles against: param types, the PlotteryParams derive and the project's entry point. Plottery is a creative coding framework for generative vector graphics and pen plotting."
version.workspace = true
authors.workspace = true
license.workspace = true
categories.workspace = true
repository.workspace = true
keywords.workspace = true
readme = "README.md"

[dependencies]
plottery_runtime_macros = { path = "runtime_macros", version = "^0.18.0" }
plottery_lib = { path = "../lib", version = "^0.18.0" }
anyhow = "1.0.75"
bincode = "1.3.3"
clap = { version = "4.4.18", features = ["derive"] }
open = "5.1.2"
serde = { version = "1.0", features = ["derive"] }
