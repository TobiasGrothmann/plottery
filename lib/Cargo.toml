[package]
name = "plottery_lib"
edition = "2021"
description = "Core geometry library of Plottery, a creative coding framework for generative vector graphics and pen plotting."
version.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
categories.workspace = true
repository.workspace = true
keywords.workspace = true
exclude = ["samples/**/*.svg"]

[features]
default = ["text", "image", "voronoi"]
text = ["dep:plottery_fonts", "dep:skrifa", "dep:harfrust", "dep:flate2"]
image = ["dep:image"]
voronoi = ["dep:voronoice"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
plottery_fonts = { path = "../fonts", version = "^0.23.4", optional = true }
geo = { version = "0.33.1", default-features = false, features = ["multithreading"] }
voronoice = { version = "0.2.0", optional = true }
image = { workspace = true, optional = true }
itertools.workspace = true
anyhow.workspace = true
svg = "0.18"
serde.workspace = true
postcard.workspace = true
fastnoise-lite = "1.1.1"
rand = "0.10"
rand_distr = "0.6"
rayon.workspace = true
num-traits = "0.2"
skrifa = { version = "0.50", optional = true }
harfrust = { version = "0.16", optional = true }
flate2 = { version = "1", optional = true }
rustc-hash = "2"

[dev-dependencies]
tempfile.workspace = true
