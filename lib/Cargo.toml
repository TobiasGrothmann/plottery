[package]
name = "plottery_lib"
edition = "2021"
description = "Core geometry library of Plottery, a creative coding framework for generative vector graphics and pen plotting."
version.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
categories.workspace = true
repository.workspace = true
keywords.workspace = true
exclude = ["samples/**/*.svg"]

[dependencies]
plottery_fonts = { path = "../fonts", version = "^0.18.0" }
geo = { version = "0.33.1", default-features = false, features = ["multithreading"] }
voronoice = "0.2.0"
geo-types = "0.7.12"
geometry-predicates = "0.3.0"
image.workspace = true
itertools.workspace = true
anyhow.workspace = true
svg = "0.18"
serde.workspace = true
postcard.workspace = true
fastnoise-lite = "1.1.1"
rand = "0.10"
rand_distr = "0.6"
ramer_douglas_peucker = "0.2.2"
mint = "0.5.9"
rayon.workspace = true
num-traits = "0.2"
skrifa = "0.50"
harfrust = "0.16"
flate2 = "1"
rustc-hash = "2"

[dev-dependencies]
tempfile.workspace = true
