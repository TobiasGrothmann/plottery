[package]
name = "plottery_editor"
edition = "2021"
description = "Graphical Editor of Plottery, a creative coding framework for generative vector graphics and pen plotting."
version.workspace = true
rust-version = "1.89"
authors.workspace = true
license.workspace = true
categories.workspace = true
repository.workspace = true
keywords.workspace = true
exclude = ["screenshots"]

[package.metadata.release]
pre-release-hook = ["../scripts/release_editor.sh", "{{version}}", "false"]

[dependencies]
plottery_lib = { path = "../lib", version = "^0.18.0" }
plottery_project = { path = "../project", version = "^0.18.0" }
plottery_runtime = { path = "../runtime", version = "^0.18.0" }
plottery_server_lib = { path = "../server_lib", version = "^0.18.0" }
dioxus = { version = "0.7", features = ["desktop"] }
serde.workspace = true
serde_json.workspace = true
dioxus-logger = "0.7"
path-absolutize.workspace = true
chrono.workspace = true
dioxus-router = "0.7"
tokio.workspace = true
notify = "8"
rfd = { version = "0.17", default-features = false }
regex = "1.10.3"
base64 = "0.22.0"
open.workspace = true
which = "8.0"
anyhow.workspace = true
image.workspace = true
notify-rust = "4.19.0"

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "PlotteryEditor"
path = "src/main.rs"
