[package]
name = "plottery_cli"
edition = "2021"
description = "Command line interface of Plottery, a creative coding framework for generative vector graphics and pen plotting."
version.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
categories.workspace = true
repository.workspace = true
keywords.workspace = true

[[bin]]
name = "plottery"
path = "src/main.rs"

[dependencies]
plottery_project = { path = "../project", version = "^0.23.3" }
plottery_runtime = { path = "../runtime", version = "^0.23.3" }
plottery_lib = { path = "../lib", version = "^0.23.3" }
clap.workspace = true
anyhow.workspace = true
futures-lite.workspace = true
rayon.workspace = true
ctrlc = "3.5.3"

[dev-dependencies]
tempfile.workspace = true
